<svg xmlns="http://www.w3.org/2000/svg" width="279" height="50" viewBox="0 0 279 50" role="img" aria-label="adam.hassen941@gmail.com"><defs></defs><style>



.card{fill:#FFFFFF;stroke:#E3E8F2;stroke-width:1}
.h1{fill:#111A33;font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-1.4px}
.h2{fill:#111A33;font:650 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.2px}
.h3{fill:#111A33;font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.role{fill:#2F5BEA;font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.body{fill:#3E4866;font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.small{fill:#6B7592;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.date{fill:#6B7592;font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.kick{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.chip{fill:#F2F5FB}
.chipt{fill:#3E4866;font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.acc{fill:#2F5BEA}.acc2{fill:#0E9F8F}
.in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}.pulse{opacity:0!important}}
.bt{fill:#111A33;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.pri{fill:#2F5BEA}.prit{fill:#FFFFFF;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}</style><rect class="pri" x=".5" y=".5" width="278" height="49" rx="24.5"/><g transform="translate(30 25.0)"><rect x="-9" y="-6.5" width="18" height="13" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/><path d="M-8-5l8 6 8-6" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"/></g><text class="prit" x="52" y="30.5">adam.hassen941@gmail.com</text></svg>