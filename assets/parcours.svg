<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="636" viewBox="0 0 1200 636" role="img" aria-label="Expérience : LinqCe, Vermeg, Aman Bank. Formation : ENSIM et ESPRIT."><defs></defs><style>
:root{--card:#FFFFFF;--line:#E3E8F2;--ink:#111A33;--body:#3E4866;--muted:#6B7592;--chip:#F2F5FB;
--acc:#2F5BEA;--acc2:#0E9F8F;--ok:#12A150;--wash1:#E9EEFF;--wash2:#E3F6F3}
@media (prefers-color-scheme:dark){:root{--card:#10162A;--line:#242C44;--ink:#EEF2FB;--body:#B9C1D8;
--muted:#8A94AF;--chip:#18203A;--acc:#7C9CFF;--acc2:#3CCFBE;--ok:#3DDC84;--wash1:#18224A;--wash2:#0F2A2E}}

.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.h1{fill:var(--ink);font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-1.4px}
.h2{fill:var(--ink);font:650 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.2px}
.h3{fill:var(--ink);font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.role{fill:var(--acc);font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.body{fill:var(--body);font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.small{fill:var(--muted);font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.date{fill:var(--muted);font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.kick{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.chip{fill:var(--chip)}
.chipt{fill:var(--body);font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.acc{fill:var(--acc)}.acc2{fill:var(--acc2)}
.in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}.pulse{opacity:0!important}}
.rail{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.45,0,.2,1) forwards}</style><rect class="card" x=".5" y=".5" width="1199" height="635" rx="18"/><line x1="620" x2="620" y1="40" y2="596" stroke="var(--line)"/><text class="h2 in" style="animation-delay:0.00s" x="48" y="62">Expérience</text><line x1="54" x2="54" y1="107" y2="459" stroke="var(--line)" stroke-width="2"/><line class="rail" pathLength="1" x1="54" x2="54" y1="107" y2="459" stroke="var(--acc)" stroke-width="2" style="animation-delay:0.20s"/><g class="in" style="animation-delay:0.25s"><circle cx="54" cy="107" r="6" fill="var(--card)" stroke="var(--acc)" stroke-width="2"/><circle cx="54" cy="107" r="2.5" fill="var(--acc)"/><text class="date" x="76" y="112">2025 – 2026</text><text class="h3" x="76" y="140">Associé technique</text><text class="kick" x="76" y="162" style="fill:var(--acc)">LinqCe</text><text class="body" x="76" y="188">Cofondation d&#x27;une plateforme de mise en relation entre</text><text class="body" x="76" y="210">indépendants, entreprises, associations et administrations.</text><text class="body" x="76" y="232">Intégration de l&#x27;IA et développement full-stack.</text></g><g class="in" style="animation-delay:0.47s"><circle cx="54" cy="283" r="6" fill="var(--card)" stroke="var(--acc)" stroke-width="2"/><circle cx="54" cy="283" r="2.5" fill="var(--acc)"/><text class="date" x="76" y="288">2024 – 2025</text><text class="h3" x="76" y="316">Stage ingénieur</text><text class="kick" x="76" y="338" style="fill:var(--acc)">Vermeg, département Assurance</text><text class="body" x="76" y="364">Dashboard de surveillance des logs en temps réel, classification</text><text class="body" x="76" y="386">automatique des erreurs et modèle prédictif pour anticiper les</text><text class="body" x="76" y="408">incidents.</text></g><g class="in" style="animation-delay:0.69s"><circle cx="54" cy="459" r="6" fill="var(--card)" stroke="var(--acc)" stroke-width="2"/><circle cx="54" cy="459" r="2.5" fill="var(--acc)"/><text class="date" x="76" y="464">2023 – 2024</text><text class="h3" x="76" y="492">Stage</text><text class="kick" x="76" y="514" style="fill:var(--acc)">Aman Bank</text><text class="body" x="76" y="540">Application web bancaire en Angular et Node.js :</text><text class="body" x="76" y="562">authentification, modules, consultation des chèques et des</text><text class="body" x="76" y="584">effets.</text></g><text class="h2 in" style="animation-delay:0.30s" x="664" y="62">Formation</text><line x1="670" x2="670" y1="107" y2="261" stroke="var(--line)" stroke-width="2"/><line class="rail" pathLength="1" x1="670" x2="670" y1="107" y2="261" stroke="var(--acc2)" stroke-width="2" style="animation-delay:0.50s"/><g class="in" style="animation-delay:0.55s"><circle cx="670" cy="107" r="6" fill="var(--card)" stroke="var(--acc2)" stroke-width="2"/><circle cx="670" cy="107" r="2.5" fill="var(--acc2)"/><text class="date" x="692" y="112">2025 – 2027</text><text class="h3" x="692" y="140">Ingénieur informatique, IHM</text><text class="kick" x="692" y="162" style="fill:var(--acc2)">ENSIM, Le Mans Université</text><text class="body" x="692" y="188">Spécialité Interaction Personnes-Systèmes : UX/UI, DevOps,</text><text class="body" x="692" y="210">mobile, visualisation, réalité augmentée, ML avancé.</text></g><g class="in" style="animation-delay:0.77s"><circle cx="670" cy="261" r="6" fill="var(--card)" stroke="var(--acc2)" stroke-width="2"/><circle cx="670" cy="261" r="2.5" fill="var(--acc2)"/><text class="date" x="692" y="266">2021 – 2026</text><text class="h3" x="692" y="294">Ingénieur informatique, Data Science</text><text class="kick" x="692" y="316" style="fill:var(--acc2)">ESPRIT, Tunis</text><text class="body" x="692" y="342">Statistiques, séries temporelles, Big Data, machine</text><text class="body" x="692" y="364">learning et deep learning.</text></g></svg>