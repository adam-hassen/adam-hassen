<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" role="img" aria-label="AR-Secours : Application Android de réalité augmentée pour apprendre les gestes de premiers secours."><defs></defs><style>
:root{--card:#FFFFFF;--line:#E3E8F2;--ink:#111A33;--body:#3E4866;--muted:#6B7592;--chip:#F2F5FB;
--acc:#2F5BEA;--acc2:#0E9F8F;--ok:#12A150;--wash1:#E9EEFF;--wash2:#E3F6F3}
@media (prefers-color-scheme:dark){:root{--card:#10162A;--line:#242C44;--ink:#EEF2FB;--body:#B9C1D8;
--muted:#8A94AF;--chip:#18203A;--acc:#7C9CFF;--acc2:#3CCFBE;--ok:#3DDC84;--wash1:#18224A;--wash2:#0F2A2E}}

.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.h1{fill:var(--ink);font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-1.4px}
.h2{fill:var(--ink);font:650 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.2px}
.h3{fill:var(--ink);font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.role{fill:var(--acc);font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.body{fill:var(--body);font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.small{fill:var(--muted);font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.date{fill:var(--muted);font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.kick{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.chip{fill:var(--chip)}
.chipt{fill:var(--body);font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.acc{fill:var(--acc)}.acc2{fill:var(--acc2)}
.in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}.pulse{opacity:0!important}}
:root{--k:#DB2777}@media (prefers-color-scheme:dark){:root{--k:#F472B6}}.edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{to{transform:scaleY(1)}}.blink{animation:bk 1.6s ease-in-out infinite}@keyframes bk{50%{opacity:.2}}.spin{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.bar2{transform-box:fill-box;transform-origin:left;animation:fill 2.6s ease-in-out infinite}@keyframes fill{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}.top{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s cubic-bezier(.3,0,.2,1) .1s forwards}.arrow{opacity:.55}</style><rect class="card" x=".5" y=".5" width="589" height="235" rx="16"/><rect class="top" x="28" y="0.5" width="64" height="3" rx="1.5" fill="var(--k)"/><g class="in"><text class="kick" x="28" y="46" style="fill:var(--k)">Réalité augmentée</text><text class="h2" x="28" y="78">AR-Secours</text></g><text class="body in" style="animation-delay:.12s" x="28" y="110">Application Android de réalité augmentée pour</text><text class="body in" style="animation-delay:.12s" x="28" y="132">apprendre les gestes de premiers secours.</text><g class="in" style="animation-delay:0.25s"><rect class="chip" x="28" y="186" width="36" height="26" rx="13"/><text class="chipt" x="39" y="203.5">C#</text></g><g class="in" style="animation-delay:0.31s"><rect class="chip" x="72" y="186" width="57" height="26" rx="13"/><text class="chipt" x="83" y="203.5">Unity</text></g><g class="in" style="animation-delay:0.37s"><rect class="chip" x="137" y="186" width="113" height="26" rx="13"/><text class="chipt" x="148" y="203.5">AR Foundation</text></g><g opacity=".95"><g transform="translate(498 70)"><path d="M-34-20v-14h14M20-34h14v14M34 20v14H20M-20 34h-14V20" fill="none" stroke="var(--k)" stroke-width="2.2" stroke-linecap="round"/><circle r="9" fill="none" stroke="var(--k)" stroke-width="2"/><circle r="9" fill="none" stroke="var(--k)" class="pulse"/></g></g><path class="arrow" d="M550 194l8-8m0 0h-7m7 0v7" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>