<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" role="img" aria-label="MonBudget : Application Android de gestion de budget pour étudiants : dépenses, objectifs et tableau de bord."><defs></defs><style>



.card{fill:#10162A;stroke:#242C44;stroke-width:1}
.h1{fill:#EEF2FB;font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-1.4px}
.h2{fill:#EEF2FB;font:650 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.2px}
.h3{fill:#EEF2FB;font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.role{fill:#7C9CFF;font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.body{fill:#B9C1D8;font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.small{fill:#8A94AF;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.date{fill:#8A94AF;font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.kick{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.chip{fill:#18203A}
.chipt{fill:#B9C1D8;font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.acc{fill:#7C9CFF}.acc2{fill:#3CCFBE}
.in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}.pulse{opacity:0!important}}
.edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{to{transform:scaleY(1)}}.blink{animation:bk 1.6s ease-in-out infinite}@keyframes bk{50%{opacity:.2}}.spin{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.bar2{transform-box:fill-box;transform-origin:left;animation:fill 2.6s ease-in-out infinite}@keyframes fill{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}.top{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s cubic-bezier(.3,0,.2,1) .1s forwards}.arrow{opacity:.55}</style><rect class="card" x=".5" y=".5" width="589" height="235" rx="16"/><rect class="top" x="28" y="0.5" width="64" height="3" rx="1.5" fill="#38BDF8"/><g class="in"><text class="kick" x="28" y="46" style="fill:#38BDF8">Application mobile</text><text class="h2" x="28" y="78">MonBudget</text></g><text class="body in" style="animation-delay:.12s" x="28" y="110">Application Android de gestion de budget pour</text><text class="body in" style="animation-delay:.12s" x="28" y="132">étudiants : dépenses, objectifs et tableau de</text><text class="body in" style="animation-delay:.12s" x="28" y="154">bord.</text><g class="in" style="animation-delay:0.25s"><rect class="chip" x="28" y="186" width="64" height="26" rx="13"/><text class="chipt" x="39" y="203.5">Kotlin</text></g><g class="in" style="animation-delay:0.31s"><rect class="chip" x="100" y="186" width="127" height="26" rx="13"/><text class="chipt" x="111" y="203.5">Jetpack Compose</text></g><g class="in" style="animation-delay:0.37s"><rect class="chip" x="235" y="186" width="50" height="26" rx="13"/><text class="chipt" x="246" y="203.5">Room</text></g><g opacity=".95"><g transform="translate(480 30)"><rect width="38" height="80" rx="8" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="7" y="40" width="24" height="5" rx="2.5" fill="#38BDF8" fill-opacity=".3"/><rect x="7" y="40" width="24" height="5" rx="2.5" fill="#38BDF8" class="bar2"/><rect x="7" y="52" width="16" height="4" rx="2" fill="#38BDF8" fill-opacity=".3"/><rect x="7" y="61" width="20" height="4" rx="2" fill="#38BDF8" fill-opacity=".3"/><circle cx="19" cy="22" r="9" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity=".5"/></g></g><path class="arrow" d="M550 194l8-8m0 0h-7m7 0v7" fill="none" stroke="#8A94AF" stroke-width="1.6" stroke-linecap="round"/></svg>