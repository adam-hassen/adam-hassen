','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#F2F4FF">Présente-toi en quelques lignes.</text></g><circle cx="62" cy="168" r="18" fill="none" stroke="#9DB4FF" stroke-opacity=".6"/><circle cx="62" cy="168" r="5" fill="#9DB4FF"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle><g class="dots"><circle class="bob" style="animation-delay:0.0s" cx="100" cy="170" r="4" fill="#8C93AE"/><circle class="bob" style="animation-delay:0.15s" cx="116" cy="170" r="4" fill="#8C93AE"/><circle class="bob" style="animation-delay:0.3s" cx="132" cy="170" r="4" fill="#8C93AE"/></g><text class="l0" x="100" y="174" font-family="'Avenir Next','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#F2F4FF">Élève ingénieur en 5e année, en double diplôme :</text><text class="l1" x="100" y="208" font-family="'Avenir Next','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#F2F4FF">Data Science à ESPRIT (Tunis) et Interaction Personnes-Systèmes</text><text class="l2" x="100" y="242" font-family="'Avenir Next','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#F2F4FF">à l&#x27;ENSIM, Le Mans Université.</text><text class="l3" x="100" y="290" font-family="'Avenir Next','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#C9D2FF">En ce moment : IA appliquée à l&#x27;assurance, LLM locaux, RAG, machine learning.</text><text class="l4" x="100" y="324" font-family="'Avenir Next','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#C9D2FF">Je cherche mon stage de fin d&#x27;études en Data &amp; IA, mobile partout en France.</text><text class="l5" x="100" y="372" font-family="'Avenir Next','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#A88BFF" font-style="italic">Un modèle ne vaut que ce que valent ses données.</text><text class="meta" x="100" y="422" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8C93AE">généré en local · 0 € · 0 octet envoyé</text><rect x="40" y="404" width="1120" height="44" rx="22" fill="#FFFFFF" fill-opacity=".02" stroke="#2A3160"/><text x="66" y="432" font-family="'Avenir Next','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#5B6385">Demande quelque chose…</text><circle cx="1136" cy="426" r="15" fill="#F2F4FF"/><path d="M1136 433v-14m-6 6l6-6 6 6" stroke="#03040A" stroke-width="2" fill="none" stroke-linecap="round"/></svg>