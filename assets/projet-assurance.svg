<text x="28" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">Agent de personnalisation des offres avec un petit LLM local,</text><text x="28" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">conseiller RAG qui analyse un contrat en citant ses sources,</text><text x="28" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">et benchmark de la sévérité des sinistres (Allstate) : ML classique</text><text x="28" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">contre architectures hybrides, comparées sur qualité, coût et latence.</text>
