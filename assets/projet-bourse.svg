<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1B2D"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F7FC1"/><stop offset="1" stop-color="#7CC4FF"/></linearGradient></defs>
<style>.c{animation:in .8s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>
<g class="c">
<rect x="1" y="1" width="578" height="268" rx="14" fill="url(#g)" stroke="#223246"/>
<rect x="1" y="1" width="578" height="4" rx="2" fill="url(#a)"/>
<text x="28" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Prédiction des marchés boursiers</text>
<rect x="28" y="66" width="141" height="22" rx="11" fill="#7CC4FF" fill-opacity="0.15" stroke="#7CC4FF" stroke-opacity="0.6"/>
<text x="98" y="81.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#7CC4FF">Projet académique</text>
<text x="28" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">Plateforme de prédiction avec des réseaux LSTM. Responsable</text><text x="28" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">de la partie données : extraction automatique depuis plusieurs</text><text x="28" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">APIs de marché, harmonisation de sources hétérogènes, puis</text><text x="28" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#B8C7DA">preprocessing et feature engineering des séries temporelles.</text>
<rect x="28" y="220" width="66" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="61" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7CC4FF">Python</text><rect x="101.8" y="220" width="51" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="127" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7CC4FF">LSTM</text><rect x="161.0" y="220" width="102" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="212" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7CC4FF">Time Series</text><rect x="271.3" y="220" width="51" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="297" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7CC4FF">APIs</text>
</g></svg>