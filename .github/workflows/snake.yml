name: Animation des contributions

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2F7FC1&color_dots=#ebedf0,#cfe6ff,#7cc4ff,#2f7fc1,#0f2a4a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7CC4FF&color_dots=#161b22,#0c2d4d,#14508a,#2f7fc1,#7cc4ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
