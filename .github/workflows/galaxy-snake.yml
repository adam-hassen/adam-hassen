name: Contributions en orbite

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#F2F4FF&color_dots=#0A0E22,#1C2246,#3B4AA8,#6E7BFF,#B8C4FF&color_dot_border=#03040A&color_background=#03040A
            dist/github-snake.svg?color_snake=#3B4AA8&color_dots=#ebedf0,#C9D2FF,#9DB4FF,#6E7BFF,#2A3160

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
